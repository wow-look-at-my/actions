name: Download Release Binary
version: 1
description: Download a platform-specific binary, trying buildhost (pazer.build) first with GitHub Releases as fallback

inputs:
  repo:
    description: 'Repository (owner/name) to download from'
    required: true
  name:
    description: 'Binary name — used as the project name for buildhost and filters the asset ({name}_{os}_{arch}) on GitHub. If omitted, derived from the repo name.'
    required: false
  version:
    description: 'Release tag to download (omit or set to "latest" for the most recent release)'
    required: false
    default: 'latest'
  token:
    description: 'GitHub token for API authentication (used only as fallback when buildhost is unavailable)'
    required: false

outputs:
  path:
    description: 'Full path to the downloaded binary'

runs:
  using: node24
  main: index.js

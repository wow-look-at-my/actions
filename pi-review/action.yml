name: Pi Review
version: 2
description: Review a pull request using the pi coding agent SDK (via shaftoe/pi-coding-agent-action). Defaults mirror the configured local pi setup (Gemma 4 26B via llama.pazer.ai).

inputs:
  model:
    description: Model ID at the configured endpoint.
    required: false
    default: 'ggml-org/gemma-4-26B-A4B-it-GGUF:Q8_0'
  model-name:
    description: Human-readable model name registered in models.json.
    required: false
    default: 'Gemma 4 26B'
  endpoint:
    description: OpenAI-compatible base URL, including the /v1 suffix.
    required: false
    default: 'https://llama.pazer.ai/v1'
  api-key-env:
    description: Name of the env var holding the API key (populated by secret-server). The value is passed to shaftoe's action as `token`.
    required: false
    default: 'LLAMA_API_KEY'
  provider:
    description: Provider name registered in pi's models.json.
    required: false
    default: 'llama-server'
  thinking:
    description: Thinking level (off, minimal, low, medium, high, xhigh). Matches local pi defaultThinkingLevel.
    required: false
    default: 'high'
  reasoning:
    description: Whether the model supports extended thinking (true|false).
    required: false
    default: 'true'
  context-window:
    description: Model context window size in tokens.
    required: false
    default: '262144'
  max-tokens:
    description: Max output tokens.
    required: false
    default: '16384'
  prompt:
    description: Review instructions sent to the agent. Defaults to the prompt in review-prompt.md.
    required: false
    default: ''
  additional-instructions:
    description: Extra instructions appended to the review prompt.
    required: false
    default: ''
  fetch-secrets:
    description: Run secret-server first to populate API key env vars via OIDC.
    required: false
    default: 'true'
  node-version:
    description: Node.js version to use. pi requires >= 20.6.0.
    required: false
    default: '24'
  github-token:
    description: GitHub token passed through to shaftoe/pi-coding-agent-action for PR comment and diff access.
    required: false
    default: ${{ github.token }}
  load-builtin-extensions:
    description: Whether shaftoe's action should load its built-in GitHub extensions (get_pr_diff, get_thread, update_pr, create_pr).
    required: false
    default: 'true'

outputs:
  response:
    description: Markdown review produced by pi (forwarded from shaftoe's action).
    value: ${{ steps.review.outputs.response }}
  success:
    description: Whether pi completed successfully.
    value: ${{ steps.review.outputs.success }}
  input-tokens:
    description: Input tokens consumed.
    value: ${{ steps.review.outputs.input_tokens }}
  output-tokens:
    description: Output tokens generated.
    value: ${{ steps.review.outputs.output_tokens }}
  duration-seconds:
    description: Wall-clock duration of pi execution.
    value: ${{ steps.review.outputs.duration_seconds }}

runs:
  using: composite
  steps:
    - name: Fetch secrets
      if: inputs.fetch-secrets == 'true'
      uses: wow-look-at-my/actions@secret-server#latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure pi (write models.json)
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        ENDPOINT: ${{ inputs.endpoint }}
        MODEL: ${{ inputs.model }}
        MODEL_NAME: ${{ inputs.model-name }}
        API_KEY_ENV: ${{ inputs.api-key-env }}
        CONTEXT_WINDOW: ${{ inputs.context-window }}
        MAX_TOKENS: ${{ inputs.max-tokens }}
        REASONING: ${{ inputs.reasoning }}
        DEFAULT_THINKING: ${{ inputs.thinking }}
      run: "${{ github.action_path }}/configure.sh"

    - name: Resolve review prompt
      id: prompt
      shell: bash
      env:
        PROMPT_OVERRIDE: ${{ inputs.prompt }}
        ADDITIONAL: ${{ inputs.additional-instructions }}
        PROMPT_PATH: ${{ github.action_path }}/review-prompt.md
      run: |
        set -euo pipefail
        if [ -n "$PROMPT_OVERRIDE" ]; then
          prompt="$PROMPT_OVERRIDE"
        else
          prompt=$(cat "$PROMPT_PATH")
        fi
        if [ -n "$ADDITIONAL" ]; then
          prompt+=$'\n\n## Additional Instructions\n\n'
          prompt+="$ADDITIONAL"
        fi
        delim="ghadelimiter_$(openssl rand -hex 16)"
        {
          printf 'prompt<<%s\n' "$delim"
          printf '%s\n' "$prompt"
          printf '%s\n' "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Run review
      id: review
      uses: shaftoe/pi-coding-agent-action@v2
      with:
        github_token: ${{ inputs.github-token }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        base_url: ${{ inputs.endpoint }}
        thinking_level: ${{ inputs.thinking }}
        prompt: ${{ steps.prompt.outputs.prompt }}
        load_builtin_extensions: ${{ inputs.load-builtin-extensions }}

name: Pi Review
version: 3
description: Review a pull request using opencode with a local LLM. Defaults to Gemma 4 26B via llama.pazer.ai.

inputs:
  model:
    description: Model ID at the configured endpoint.
    required: false
    default: 'ggml-org/gemma-4-26B-A4B-it-GGUF:Q8_0'
  model-name:
    description: Human-readable model name for display.
    required: false
    default: 'Gemma 4 26B'
  endpoint:
    description: OpenAI-compatible base URL, including the /v1 suffix.
    required: false
    default: 'https://llama.pazer.ai/v1'
  api-key-env:
    description: Name of the env var holding the API key (populated by secret-server).
    required: false
    default: 'LLAMA_API_KEY'
  provider:
    description: Provider identifier used in opencode config.
    required: false
    default: 'llama-server'
  context-window:
    description: Model context window size in tokens.
    required: false
    default: '262144'
  max-tokens:
    description: Max output tokens.
    required: false
    default: '16384'
  prompt:
    description: Review instructions sent to the agent. Defaults to the prompt in review-prompt.md.
    required: false
    default: ''
  additional-instructions:
    description: Extra instructions appended to the review prompt.
    required: false
    default: ''
  fetch-secrets:
    description: Run secret-server first to populate API key env vars via OIDC.
    required: false
    default: 'true'
  node-version:
    description: Node.js version to use.
    required: false
    default: '24'
  github-token:
    description: GitHub token for PR access (review comments, diff, approvals).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Fetch secrets
      if: inputs.fetch-secrets == 'true'
      uses: wow-look-at-my/actions@secret-server#latest

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install opencode
      shell: bash
      run: npm install -g opencode-ai

    - name: Resolve review prompt
      id: prompt
      shell: bash
      env:
        PROMPT_OVERRIDE: ${{ inputs.prompt }}
        ADDITIONAL: ${{ inputs.additional-instructions }}
        PROMPT_PATH: ${{ github.action_path }}/review-prompt.md
      run: |
        set -euo pipefail
        if [ -n "$PROMPT_OVERRIDE" ]; then
          prompt="$PROMPT_OVERRIDE"
        else
          prompt=$(cat "$PROMPT_PATH")
        fi
        if [ -n "$ADDITIONAL" ]; then
          prompt+=$'\n\n## Additional Instructions\n\n'
          prompt+="$ADDITIONAL"
        fi
        delim="ghadelimiter_$(openssl rand -hex 16)"
        {
          printf 'prompt<<%s\n' "$delim"
          printf '%s\n' "$prompt"
          printf '%s\n' "$delim"
        } >> "$GITHUB_OUTPUT"

    - name: Build opencode config
      id: config
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        ENDPOINT: ${{ inputs.endpoint }}
        MODEL: ${{ inputs.model }}
        MODEL_NAME: ${{ inputs.model-name }}
        API_KEY_ENV: ${{ inputs.api-key-env }}
        CONTEXT_WINDOW: ${{ inputs.context-window }}
        MAX_TOKENS: ${{ inputs.max-tokens }}
        MCP_SERVER: ${{ github.action_path }}/mcp-server.mjs
      run: |
        set -euo pipefail
        config=$(node -e "
          process.stdout.write(JSON.stringify({
            provider: {
              [process.env.PROVIDER]: {
                npm: '@ai-sdk/openai-compatible',
                name: process.env.MODEL_NAME,
                options: {
                  baseURL: process.env.ENDPOINT,
                  apiKey: '{env:' + process.env.API_KEY_ENV + '}'
                },
                models: {
                  [process.env.MODEL]: {
                    name: process.env.MODEL_NAME,
                    limit: {
                      context: Number(process.env.CONTEXT_WINDOW),
                      output: Number(process.env.MAX_TOKENS)
                    }
                  }
                }
              }
            },
            mcp: {
              'pr-review': {
                type: 'local',
                enabled: true,
                command: ['node', process.env.MCP_SERVER]
              }
            }
          }))
        ")
        delim="ghadelimiter_$(openssl rand -hex 16)"
        {
          printf 'config<<%s\n' "$delim"
          printf '%s\n' "$config"
          printf '%s\n' "$delim"
        } >> "$GITHUB_OUTPUT"
        echo "$config" | jq .

    - name: Run review
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        REVIEW_PROMPT: ${{ steps.prompt.outputs.prompt }}
        OPENCODE_CONFIG_CONTENT: ${{ steps.config.outputs.config }}
        OPENCODE_PERMISSION: '{"bash":"deny","edit":"deny","write":"deny"}'
      run: |
        set -euo pipefail
        opencode run --dangerously-skip-permissions \
          --model "${{ inputs.provider }}/${{ inputs.model }}" \
          "$REVIEW_PROMPT"

name: GHCR
version: 1
description: Build, push, and prune container images on GHCR.

inputs:
  token:
    description: 'GHCR token for login and pruning (skips secret-server OIDC when set)'
    required: false
    default: ''
  login:
    description: 'Log in to GHCR'
    required: false
    default: 'true'
  build:
    description: 'Build the image with docker buildx'
    required: false
    default: 'true'
  build_dockerfile:
    description: 'Path to Dockerfile'
    required: false
    default: 'Dockerfile'
  build_context:
    description: 'Docker build context'
    required: false
    default: '.'
  build_args:
    description: 'Additional docker buildx --build-arg flags (newline-separated KEY=VALUE)'
    required: false
    default: ''
  push:
    description: 'Push the image to GHCR and prune old versions'
    required: false
    default: 'true'
  push_image:
    description: 'Full image reference (e.g., ghcr.io/owner/package:tag)'
    required: false
  push_keep:
    description: 'Number of tagged versions to keep when pruning (0 to disable)'
    required: false
    default: '10'

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/actions@secret-server#latest
      if: inputs.login == 'true' && inputs.token == ''

    - name: Login to GHCR
      if: inputs.login == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        LOGIN_TOKEN: ${{ inputs.token || env.GHCR_WRITE_TOKEN }}
      with:
        script: |
          await exec.exec('docker', ['login', 'ghcr.io', '-u', 'x-access-token', '--password-stdin'], {
            input: Buffer.from(env.LOGIN_TOKEN),
          });

    - name: Build
      if: inputs.build == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        INPUT_DOCKERFILE: ${{ inputs.build_dockerfile }}
        INPUT_IMAGE: ${{ inputs.push_image }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_CONTEXT: ${{ inputs.build_context }}
      with:
        script: |
          const buildArgs = (env.INPUT_BUILD_ARGS || '').split('\n')
            .filter(Boolean)
            .flatMap(a => ['--build-arg', a]);
          await $`docker buildx build
            -f ${env.INPUT_DOCKERFILE}
            -t ${env.INPUT_IMAGE}
            ${buildArgs}
            ${env.INPUT_PUSH === 'true' && '--push'}
            ${env.INPUT_CONTEXT}`;

    - name: Push
      if: inputs.build != 'true' && inputs.push == 'true'
      uses: wow-look-at-my/actions@typescript#latest
      env:
        INPUT_IMAGE: ${{ inputs.push_image }}
      with:
        script: await $`docker push ${env.INPUT_IMAGE}`;

    - uses: wow-look-at-my/actions@ghcr-prune#latest
      if: inputs.push == 'true' && inputs.push_keep != '0'
      with:
        image: ${{ inputs.push_image }}
        keep: ${{ inputs.push_keep }}
      env:
        GHCR_WRITE_TOKEN: ${{ inputs.token || env.GHCR_WRITE_TOKEN }}

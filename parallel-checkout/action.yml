name: Parallel Checkout
version: 1
description: Check a repository and its whole submodule tree out with every fetch and every file write running at once. Each submodule is fetched by commit the moment its parent's fetch lands, nested ones start as soon as their parent's tree is readable, and every worktree is written with git's parallel checkout while the fetches around it continue

inputs:
  repository:
    description: 'Repository to check out, as owner/name. Defaults to the repository the workflow runs in.'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'Branch, tag, full ref or commit to check out. Defaults to the ref and commit that triggered the workflow, or the default branch of another repository.'
    required: false
    default: ''
  token:
    description: 'Token for fetching the repository and its submodules. Empty fetches anonymously.'
    required: false
    default: ${{ github.token }}
  path:
    description: 'Directory under the workspace to check out into. Defaults to the workspace itself.'
    required: false
    default: ''
  fetch-depth:
    description: 'Commits of history to fetch at every level. 0 fetches everything.'
    required: false
    default: '1'
  submodules:
    description: 'Which submodules to take: `recursive` for the whole tree, `true` for the first level, `false` for none.'
    required: false
    default: 'recursive'
  submodule-branch:
    description: 'A branch name. Each direct submodule inside `submodule-branch-scope` then takes the head of this branch on its remote instead of its gitlink, falling back to the `branch` its .gitmodules entry names, then to the remote''s default branch. Pass the workflow''s `github.ref_name` so a dependency rides the same-named branch. A dependency''s own submodules stay at the commits it names. Empty keeps every gitlink.'
    required: false
    default: ''
  submodule-branch-scope:
    description: 'URL prefixes, one per line, of the submodules that follow `submodule-branch`. Defaults to every repository of the superproject''s owner on the same server.'
    required: false
    default: ''
  submodule-branch-lock:
    description: 'URL of a run lock store, such as https://pazer.build. Each followed submodule then takes the commit the first job of this run attempt found on its branch, so every job of the attempt builds the same commit. The job needs `id-token: write`. Empty takes the current head in each job.'
    required: false
    default: ''
  store:
    description: 'A directory of bare repositories, one per url, that every fetch fills, and of the worktrees of recent commits. A commit already there is not fetched again, and its stored worktree moves into place instead of being written. Defaults to parallel-checkout under RUNNER_TOOL_CACHE.'
    required: false
    default: ''
  jobs:
    description: 'How many git processes may run at once across the whole tree.'
    required: false
    default: '32'
  persist-credentials:
    description: 'Write the token into every checked-out repository, so later steps can fetch and push with it.'
    required: false
    default: 'true'
  clean:
    description: 'Delete whatever is in the target directory before the checkout.'
    required: false
    default: 'true'
  lfs:
    description: 'Put the content of every Git LFS file into the superproject and every submodule this checks out, in place of its pointer, and install git-lfs into each repository that has LFS files and into the superproject. The objects download with the token the git fetches use, while git writes the worktree, and land in the store, so a later checkout fetches only the objects the store lacks. Needs git-lfs on the runner. A file that still holds its pointer afterwards fails the step. False leaves every LFS file as its pointer.'
    required: false
    default: 'false'

outputs:
  commit:
    description: 'The commit the worktree is at.'
  ref:
    description: 'The full ref that was checked out, or the commit when a bare commit was asked for.'
  store-added:
    description: 'How many repositories and worktrees this run added to the store. Zero means the store already held everything, so a cache of the store need not be saved again.'

runs:
  using: node24
  main: dist/index.js

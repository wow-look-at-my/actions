name: Run dats
description: Download the dats binary from buildhost and run its suites, without a caller hand-rolling the download

inputs:
  tests:
    description: 'Space- or newline-separated .dats files and directories to run, relative to working-directory'
    required: false
    default: '**/*.dats'
  working-directory:
    description: 'Directory to run dats from'
    required: false
    default: '.'

outputs:
  path:
    description: 'Full path to the downloaded dats binary'
    value: ${{ steps.download.outputs.path }}

runs:
  using: composite
  steps:
    # A relative path, never common-checks#latest: resolving the tag made this repo's publish depend on this repo's last publish, so one bad release bricked the run that would replace it.
    - uses: ./common-checks

    - name: Download dats
      id: download
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: dats

    # ubuntu-24.04 gates the unprivileged user namespace bwrap needs behind apparmor, so clear it where the kernel has it.
    - name: Install the sandbox backend
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v bwrap >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y bubblewrap
        fi
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

    # A shell starts the APE: execve cannot read its header, so a bare exec is exit 126.
    - name: Run dats
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DATS_BIN: ${{ steps.download.outputs.path }}
        DATS_TESTS: ${{ inputs.tests }}
      run: |
        set -euo pipefail
        read -r -a suites <<<"$(printf '%s' "$DATS_TESTS" | tr '\n' ' ')"
        bash "$DATS_BIN" test "${suites[@]}"

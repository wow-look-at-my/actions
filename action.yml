name: Cached apt
version: 1
description: >-
  Install apt packages on a Linux runner from a cache of the files they dropped,
  skipping `apt-get update` and `apt-get install` on a hit. Restored packages are
  plain files: dpkg does not record them as installed, maintainer scripts and
  update-alternatives do not run, and only `ldconfig` is re-run. Suits build and
  test dependencies; not packages that need a service, a user or an alternative.
  On a non-Linux runner it installs nothing and succeeds, so a matrix calls it
  without an `if:` guard; it says so, and sets `skipped` to true.

inputs:
  packages:
    description: 'apt packages to install, separated by whitespace, newlines or commas'
    required: true
  key:
    description: 'Extra text mixed into the cache key; change it to discard every existing entry'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'true when the files came from the cache and apt never ran'
    value: ${{ steps.apply.outputs.cache-hit || steps.plan.outputs.cache-hit }}
  installed-packages:
    description: 'Space-separated packages the cache holds, including pulled-in dependencies'
    value: ${{ steps.apply.outputs.installed-packages || steps.plan.outputs.installed-packages }}
  skipped:
    description: 'true when the runner is not Linux, so nothing was installed'
    value: ${{ steps.plan.outputs.skipped }}

# The cache is buildhost's, so the job needs id-token write.
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        INPUT_KEY: ${{ inputs.key }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js" plan

    - id: restore
      if: steps.plan.outputs.skipped != 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-cache-restore@lkgb
      with:
        path: ${{ steps.plan.outputs.work-dir }}
        key: ${{ steps.plan.outputs.key }}

    - id: apply
      if: steps.plan.outputs.skipped != 'true'
      shell: bash
      env:
        INPUT_PACKAGES: ${{ inputs.packages }}
        CACHED_APT_KEY: ${{ steps.plan.outputs.key }}
        CACHED_APT_WORK_DIR: ${{ steps.plan.outputs.work-dir }}
        CACHED_APT_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js" apply

    - if: steps.apply.outputs.save == 'true'
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-cache-save@lkgb
      with:
        path: ${{ steps.plan.outputs.work-dir }}
        key: ${{ steps.plan.outputs.key }}

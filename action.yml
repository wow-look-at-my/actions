name: 'Action Validator'
version: 1
description: 'Validate GitHub Action action.yml files'
inputs:
  actions:
    description: 'Glob pattern for action.yml files to validate'
    required: false
    default: '*/action.yml'
  workflows:
    description: 'Glob pattern for workflow files to validate'
    required: false
    default: '.github/workflows/*.yml'

runs:
  using: composite
  steps:
    - name: Install action-validator
      shell: bash
      run: npm install -g @action-validator/core @action-validator/cli

    - name: Validate actions
      shell: bash
      run: |
        shopt -s nullglob
        for f in ${{ inputs.actions }}; do
          echo "Validating $f"
          action-validator "$f"
        done

    # Workflows are validated against the LIVE schema, not action-validator's.
    # action-validator vendors its schema into a wasm blob (@action-validator/
    # core, pinned at 0.6.0 with no newer release) that has fallen behind
    # GitHub: it rejects generally-available permission scopes -- among them
    # `artifact-metadata` -- so a correct workflow fails with "Additional
    # property 'artifact-metadata' is not allowed". Fetching schemastore's
    # github-workflow.json here keeps the check current instead of pinning it
    # to whenever that wasm was last rebuilt. A fetch failure is a hard error,
    # never a skipped check.
    - name: Validate workflows
      shell: bash
      env:
        WORKFLOW_GLOB: ${{ inputs.workflows }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        files=(${WORKFLOW_GLOB})
        if [ ${#files[@]} -eq 0 ]; then
          echo "No workflow files matched '${WORKFLOW_GLOB}'; nothing to validate"
          exit 0
        fi
        workdir="${RUNNER_TEMP}/action-validator-workflows"
        mkdir -p "${workdir}"
        curl -fsSL https://json.schemastore.org/github-workflow.json \
          -o "${workdir}/github-workflow.json"
        npm install --silent --no-fund --no-audit --prefix "${workdir}" \
          ajv@8 ajv-formats@3 js-yaml@4
        # The script must live NEXT TO the installed node_modules: ESM `import`
        # ignores NODE_PATH and resolves by walking up from the script's own
        # directory, so running it from the action path would not find ajv.
        cp "${GITHUB_ACTION_PATH}/validate-workflows.mjs" "${workdir}/"
        node "${workdir}/validate-workflows.mjs" \
          "${workdir}/github-workflow.json" "${files[@]}"

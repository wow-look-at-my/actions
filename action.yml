name: Push Excludes Tags
description: Fail CI when a workflow's push trigger names no ref filter, so tag pushes start it again

inputs:
  paths:
    description: 'Paths to read, space separated. A directory is walked, so the step must run after the checkout.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/slopfix@master
      with:
        only: yaml/push-tags
        paths: ${{ inputs.paths }}

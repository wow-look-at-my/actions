name: 'Fetch Secrets'
version: 1
description: 'Fetch secrets from a self-hosted secret server using GitHub Actions OIDC'

inputs:
  url:
    description: 'Secret server URL'
    required: false
    default: 'https://secrets.pazer.io'
  audience:
    description: 'OIDC audience for the secret server (defaults to the URL)'
    required: false

outputs:
  secrets:
    description: 'JSON object of secrets'
    value: ${{ steps.fetch.outputs.secrets }}
  buildkit-secret-envs:
    description: 'One NAME=NAME line per secret, for the secret-envs input of docker/build-push-action. Each secret becomes a BuildKit secret of the same id.'
    value: ${{ steps.fetch.outputs.buildkit-secret-envs }}

runs:
  using: 'composite'
  steps:
    - name: Fetch OIDC token and secrets
      id: fetch
      shell: bash
      env:
        SECRET_SERVER_AUDIENCE: ${{ inputs.audience }}
      run: |
        AUDIENCE="${SECRET_SERVER_AUDIENCE:-${{ inputs.url }}}"
        export AUDIENCE

        OIDC_TOKEN=$(bash "$GITHUB_ACTION_PATH/fetch-oidc-token.sh") || exit 1

        export OIDC_TOKEN SECRET_SERVER_URL="${{ inputs.url }}"
        SECRETS=$(bash "$GITHUB_ACTION_PATH/fetch-secrets.sh") || exit 1

        # Set output using delimiter format (safe for multiline values)
        delimiter="ghadelimiter_$(openssl rand -hex 8)"
        printf 'secrets<<%s\n%s\n%s\n' "$delimiter" "$SECRETS" "$delimiter" >> "$GITHUB_OUTPUT"
        envs=$(SECRETS="$SECRETS" bash "$GITHUB_ACTION_PATH/buildkit-secret-envs.sh") || exit 1
        printf 'buildkit-secret-envs<<%s\n%s\n%s\n' "$delimiter" "$envs" "$delimiter" >> "$GITHUB_OUTPUT"

        # Export each secret as an environment variable using delimiter format
        export SECRETS
        bash "$GITHUB_ACTION_PATH/export-secrets.sh"

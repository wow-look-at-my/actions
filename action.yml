name: No Tests In YAML
description: Fail CI when a GitHub Actions YAML file carries a test instead of invoking the repository's own suite

inputs:
  paths:
    description: 'Paths to read, space separated. A directory is walked, so the step must run after the checkout.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/slopfix@master
      with:
        only: yaml/test-in-workflow
        paths: ${{ inputs.paths }}

name: Release Actions

on:
  push:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup orphaned branch tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./orphan-release/orphan-cleanup.sh

  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README is up-to-date
        run: |
          ./generate-readme.sh > README.md.tmp
          if ! diff -q README.md README.md.tmp > /dev/null 2>&1; then
            echo "::error::README.md is out of date. Run ./generate-readme.sh > README.md and commit the result."
            diff README.md README.md.tmp || true
            exit 1
          fi
          rm README.md.tmp

  no-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      - name: Build no-scripts-action
        working-directory: no-scripts-action
        run: just build
      - uses: ./no-scripts-action

  test-cache-rg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./cache-rg/test

  test-typescript:
    runs-on: ubuntu-latest
    # repro3.ts in the dogfood harness makes a real authenticated octokit call
    # (repos.get) with the default github-token, so the job needs read access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      # typescript is a node24 action: its dist/ is not committed, so build it
      # before the dogfood harness invokes it via `uses: ./typescript`.
      - name: Build typescript action
        working-directory: typescript
        run: just build
      # Guard against the "fake string" branded-primitive footgun (boxed String
      # output streams) creeping back in. Type-aware ESLint config under
      # typescript/eslint.config.js; known existing cases carry scoped disables.
      - name: Lint typescript action
        working-directory: typescript
        run: just lint
      - uses: ./typescript/test

  # Live end-to-end exercise of the cache hand-off trio against the real
  # cache service: produce two hand-offs (tar + raw mode), consume them in a
  # later job asserting contents and permission bits, then janitor the run's
  # entries with cache-cleanup and prove via the documented REST list API
  # that they are gone. Keys embed the run id, so concurrent runs never
  # collide. All three are node24 actions whose dist/ is not committed, so
  # each job builds the action it invokes before `uses: ./<dir>`.
  test-cache-xfer-produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      - name: Build cache-upload
        working-directory: cache-upload
        run: just build
      - name: Create fixtures
        run: |
          set -euo pipefail
          mkdir -p /tmp/xfer-src/sub
          echo "hello dir" > /tmp/xfer-src/plain.txt
          echo "nested" > /tmp/xfer-src/sub/nested.txt
          echo "dot" > /tmp/xfer-src/.hidden
          printf '#!/bin/sh\necho ok\n' > /tmp/xfer-src/tool
          chmod +x /tmp/xfer-src/tool
          printf 'raw payload' > /tmp/xfer-raw-file
          chmod 0755 /tmp/xfer-raw-file
      - name: Upload directory hand-off (tar mode)
        uses: ./cache-upload
        with:
          name: xfer-dir
          path: /tmp/xfer-src
      - name: Upload single-file hand-off (raw mode)
        uses: ./cache-upload
        with:
          name: xfer-raw
          path: /tmp/xfer-raw-file

  test-cache-xfer-consume:
    needs: test-cache-xfer-produce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      - name: Build cache-download
        working-directory: cache-download
        run: just build
      - name: Download directory hand-off
        id: dl-dir
        uses: ./cache-download
        with:
          name: xfer-dir
          path: /tmp/xfer-out-dir
      - name: Download single-file hand-off
        id: dl-raw
        uses: ./cache-download
        with:
          name: xfer-raw
          path: /tmp/xfer-out-raw
      - name: Assert restored contents, modes, and outputs
        env:
          DIR_CACHE_HIT: ${{ steps.dl-dir.outputs.cache-hit }}
          DIR_DOWNLOAD_PATH: ${{ steps.dl-dir.outputs.download-path }}
          RAW_MATCHED_KEY: ${{ steps.dl-raw.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          [ "$(cat /tmp/xfer-out-dir/plain.txt)" = "hello dir" ]
          [ "$(cat /tmp/xfer-out-dir/sub/nested.txt)" = "nested" ]
          [ "$(cat /tmp/xfer-out-dir/.hidden)" = "dot" ]
          [ -x /tmp/xfer-out-dir/tool ]
          [ "$(/tmp/xfer-out-dir/tool)" = "ok" ]
          [ "$(cat /tmp/xfer-out-raw/xfer-raw-file)" = "raw payload" ]
          [ -x /tmp/xfer-out-raw/xfer-raw-file ]
          [ "$DIR_CACHE_HIT" = "true" ]
          [ "$DIR_DOWNLOAD_PATH" = "/tmp/xfer-out-dir" ]
          [ "$RAW_MATCHED_KEY" = "cache-xfer-xfer-raw-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]

  test-cache-xfer-cleanup:
    needs: test-cache-xfer-consume
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cache-cleanup deletes cache entries via the REST API
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Assert this run's hand-off entries exist before cleanup
        run: |
          set -euo pipefail
          dir=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=cache-xfer-xfer-dir-${GITHUB_RUN_ID}-" --jq '.total_count')
          raw=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=cache-xfer-xfer-raw-${GITHUB_RUN_ID}-" --jq '.total_count')
          echo "before cleanup: dir=$dir raw=$raw (want >0 each)"
          [ "$dir" -gt 0 ]
          [ "$raw" -gt 0 ]
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      - name: Build cache-cleanup
        working-directory: cache-cleanup
        run: just build
      - name: Run cache-cleanup
        uses: ./cache-cleanup
      - name: Assert this run's hand-off entries are gone
        run: |
          set -euo pipefail
          dir=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=cache-xfer-xfer-dir-${GITHUB_RUN_ID}-" --jq '.total_count')
          raw=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=cache-xfer-xfer-raw-${GITHUB_RUN_ID}-" --jq '.total_count')
          echo "after cleanup: dir=$dir raw=$raw (want 0 each)"
          [ "$dir" = "0" ]
          [ "$raw" = "0" ]

  validate-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate action slugs
        run: |
          repo="${{ github.repository }}"
          errors=0

          # Correct format:   repo@action-name#ref
          # Wrong format:     repo/action-name@ref
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            num=$(echo "$line" | cut -d: -f2)
            match=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
            slug=$(echo "$match" | grep -oP "(?<=${repo}/)[^@/]+" || true)
            echo "::error file=${file},line=${num}::Wrong action slug format '${slug}' — use ${repo}@${slug}#ref instead of ${repo}/${slug}@ref"
            errors=$((errors + 1))
          done < <(grep -rn "${repo}/[a-zA-Z0-9_-]*@" --include='*.yml' --include='*.yaml' --include='*.md' . || true)

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML with action-validator
        uses: ./action-validator
        with:
          # Only the workflow files are validated here. The repo's action.yml
          # files carry a non-standard `version:` field (consumed by this
          # workflow's release jobs for orphan tags) and `using: node24`, both of
          # which action-validator's bundled schema rejects -- so a non-matching
          # glob skips them (nullglob -> zero iterations) while every workflow,
          # including the reusable ones, is schema-checked.
          actions: 'no-such-dir/*/action.yml'
          workflows: '.github/workflows/*.yml'

  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      composite: ${{ steps.find.outputs.composite }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Skip */test/* — those are dogfood harnesses invoked from CI, not released actions.
          node() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ -f "$n/package.json" ] && echo "$n"
            done
          }
          composite() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ ! -f "$n/package.json" ] && echo "$n"
            done
          }
          echo "node=$(node | jq -R | jq -sc)" >> $GITHUB_OUTPUT
          echo "composite=$(composite | jq -R | jq -sc)" >> $GITHUB_OUTPUT

  release-node:
    needs: [cleanup, detect]
    if: needs.detect.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect.outputs.node) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: extractions/setup-just@v2

      - name: Build
        working-directory: ${{ matrix.action }}
        run: just build

      - name: Test
        working-directory: ${{ matrix.action }}
        run: |
          if compgen -G "src/*.test.ts" > /dev/null; then
            pnpm tsx --test src/*.test.ts
          fi

      - name: Validate action.yml
        run: |
          action="${{ matrix.action }}"
          version=$(yq '.version' "$action/action.yml")
          if [ "$version" = "null" ] || [ -z "$version" ]; then
            echo "::error::$action/action.yml is missing required 'version' field"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

          main=$(yq '.runs.main' "$action/action.yml")
          if [ "$main" != "null" ] && [ -n "$main" ]; then
            if [ ! -f "$action/$main" ]; then
              echo "::error::$action/action.yml runs.main points to '$main' which does not exist"
              exit 1
            fi
          fi

          for field in pre post; do
            file=$(yq ".runs.$field" "$action/action.yml")
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              if [ ! -f "$action/$file" ]; then
                echo "::error::$action/action.yml runs.$field points to '$file' which does not exist"
                exit 1
              fi
            fi
          done
        id: version

      - name: Validate JS files are parseable
        working-directory: ${{ matrix.action }}
        run: |
          for field in main pre post; do
            file=$(yq ".runs.$field" action.yml)
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              echo "Checking runs.$field: $file"
              node --check "$file"
            fi
          done

      - name: Create orphan tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./orphan-release/orphan-release.sh
          --source "${{ matrix.action }}"
          --version "${{ steps.version.outputs.version }}"
          --exclude "src node_modules tsconfig.json justfile package.json pnpm-lock.yaml pnpm-workspace.yaml"
          --include-branch

  release-composite:
    needs: [cleanup, detect]
    if: needs.detect.outputs.composite != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create orphan tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for action in $(echo '${{ needs.detect.outputs.composite }}' | jq -r '.[]'); do
            version=$(yq '.version' "$action/action.yml")
            if [ "$version" = "null" ] || [ -z "$version" ]; then
              echo "::error::$action/action.yml is missing required 'version' field"
              exit 1
            fi
            ./orphan-release/orphan-release.sh --source "$action" --version "$version" --include-branch
          done


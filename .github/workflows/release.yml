name: Release Actions

on:
  push:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup orphaned branch tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./orphan-release/orphan-cleanup.sh

  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README is up-to-date
        run: |
          ./generate-readme.sh > README.md.tmp
          if ! diff -q README.md README.md.tmp > /dev/null 2>&1; then
            echo "::error::README.md is out of date. Run ./generate-readme.sh > README.md and commit the result."
            diff README.md README.md.tmp || true
            exit 1
          fi
          rm README.md.tmp

  no-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      - name: Build no-scripts-action
        working-directory: no-scripts-action
        run: just build
      - uses: ./no-scripts-action

  test-cache-rg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./cache-rg/test

  test-typescript:
    runs-on: ubuntu-latest
    # repro3.ts in the dogfood harness makes a real authenticated octokit call
    # (repos.get) with the default github-token, so the job needs read access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      # typescript is a node24 action: its dist/ is not committed, so build it
      # before the dogfood harness invokes it via `uses: ./typescript`.
      - name: Build typescript action
        working-directory: typescript
        run: just build
      # Guard against the "fake string" branded-primitive footgun (boxed String
      # output streams) creeping back in. Type-aware ESLint config under
      # typescript/eslint.config.js; known existing cases carry scoped disables.
      - name: Lint typescript action
        working-directory: typescript
        run: just lint
      - uses: ./typescript/test

  # Integration self-test of the cache-backed artifact pair, upload half:
  # builds ./upload-artifact from source and drives it for real against the
  # Actions cache service (save, duplicate-save must fail, overwrite re-save
  # must succeed). The download half runs in test-cache-artifact-download,
  # which also deletes this run's selftest cache entries.
  test-cache-artifact:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      # upload-artifact is a node24 action: its dist/ is not committed, so
      # build it before the dogfood steps invoke it via `uses: ./upload-artifact`.
      - name: Build upload-artifact action
        working-directory: upload-artifact
        run: just build
      - name: Generate fixtures
        run: |
          mkdir -p fixtures/sub/deep
          printf 'hello from the ghart selftest\n' > fixtures/top.txt
          printf 'nested file\n' > fixtures/sub/deep/nested.txt
          printf '#!/bin/sh\necho ok\n' > fixtures/sub/run.sh
          chmod +x fixtures/sub/run.sh
          printf 'a file with spaces in its name\n' > 'fixtures/sub/file with spaces.txt'
          python3 -c 'import sys; sys.stdout.buffer.write(bytes(range(256)) * 4096)' > fixtures/blob.bin
      - name: Upload selftest artifact
        id: up
        uses: ./upload-artifact
        with:
          name: ghart-selftest
          path: fixtures
      - name: Assert upload outputs
        env:
          KEY: ${{ steps.up.outputs.artifact-key }}
          DIGEST: ${{ steps.up.outputs.artifact-digest }}
        run: |
          test -n "$KEY"
          test -n "$DIGEST"
          echo "artifact-key=$KEY"
          echo "artifact-digest=$DIGEST"
      # Cache keys are immutable: a second save of the same name must fail
      # loudly (with the duplicate-key diagnosis), never silently no-op.
      - name: Duplicate save (expected failure)
        id: dup
        continue-on-error: true
        uses: ./upload-artifact
        with:
          name: ghart-selftest
          path: fixtures
      - name: Assert the duplicate save failed
        if: steps.dup.outcome != 'failure'
        run: |
          echo "::error::the duplicate save was expected to fail but its outcome was '${{ steps.dup.outcome }}'"
          exit 1
      - name: Overwrite re-save
        id: ow
        uses: ./upload-artifact
        with:
          name: ghart-selftest
          path: fixtures
          overwrite: true
      - name: Assert the overwrite re-save succeeded
        env:
          KEY: ${{ steps.ow.outputs.artifact-key }}
          DIGEST: ${{ steps.ow.outputs.artifact-digest }}
        run: |
          test -n "$KEY"
          test -n "$DIGEST"

  # Download half of the cache-artifact self-test: restores what
  # test-cache-artifact saved on another runner, diffs the tree, checks the
  # expected failure of a nonexistent name, then deletes this run's selftest
  # cache entries so they never linger against the repo's ~10 GB cache cap.
  test-cache-artifact-download:
    needs: test-cache-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: extractions/setup-just@v2
      # download-artifact is a node24 action: its dist/ is not committed, so
      # build it before the dogfood steps invoke it via `uses: ./download-artifact`.
      - name: Build download-artifact action
        working-directory: download-artifact
        run: just build
      - name: Regenerate the expected fixtures
        run: |
          mkdir -p fixtures/sub/deep
          printf 'hello from the ghart selftest\n' > fixtures/top.txt
          printf 'nested file\n' > fixtures/sub/deep/nested.txt
          printf '#!/bin/sh\necho ok\n' > fixtures/sub/run.sh
          chmod +x fixtures/sub/run.sh
          printf 'a file with spaces in its name\n' > 'fixtures/sub/file with spaces.txt'
          python3 -c 'import sys; sys.stdout.buffer.write(bytes(range(256)) * 4096)' > fixtures/blob.bin
      - name: Download selftest artifact
        id: dl
        uses: ./download-artifact
        with:
          name: ghart-selftest
          path: restored
      - name: Assert the restored tree matches the fixtures
        env:
          DL_PATH: ${{ steps.dl.outputs.download-path }}
        run: |
          test -n "$DL_PATH"
          diff -r fixtures "$DL_PATH"
          test -x "$DL_PATH/sub/run.sh"
      - name: Download of a nonexistent name (expected failure)
        id: missdl
        continue-on-error: true
        uses: ./download-artifact
        with:
          name: ghart-no-such-artifact
          path: nowhere
      - name: Assert the nonexistent download failed
        if: steps.missdl.outcome != 'failure'
        run: |
          echo "::error::the nonexistent-name download was expected to fail but its outcome was '${{ steps.missdl.outcome }}'"
          exit 1
      - name: Clean up this run's selftest caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches?key=ghart-v1-${GITHUB_RUN_ID}-&per_page=100" \
            | jq -r '.actions_caches[].id')
          for id in $ids; do
            echo "deleting selftest cache entry id $id"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" \
              -o /dev/null -w "  HTTP %{http_code}\n"
          done

  validate-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate action slugs
        run: |
          repo="${{ github.repository }}"
          errors=0

          # Correct format:   repo@action-name#ref
          # Wrong format:     repo/action-name@ref
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            num=$(echo "$line" | cut -d: -f2)
            match=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
            slug=$(echo "$match" | grep -oP "(?<=${repo}/)[^@/]+" || true)
            echo "::error file=${file},line=${num}::Wrong action slug format '${slug}' — use ${repo}@${slug}#ref instead of ${repo}/${slug}@ref"
            errors=$((errors + 1))
          done < <(grep -rn "${repo}/[a-zA-Z0-9_-]*@" --include='*.yml' --include='*.yaml' --include='*.md' . || true)

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML with action-validator
        uses: ./action-validator
        with:
          # Only the workflow files are validated here. The repo's action.yml
          # files carry a non-standard `version:` field (consumed by this
          # workflow's release jobs for orphan tags) and `using: node24`, both of
          # which action-validator's bundled schema rejects -- so a non-matching
          # glob skips them (nullglob -> zero iterations) while every workflow,
          # including the reusable ones, is schema-checked.
          actions: 'no-such-dir/*/action.yml'
          workflows: '.github/workflows/*.yml'

  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      composite: ${{ steps.find.outputs.composite }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Skip */test/* — those are dogfood harnesses invoked from CI, not released actions.
          node() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ -f "$n/package.json" ] && echo "$n"
            done
          }
          composite() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ ! -f "$n/package.json" ] && echo "$n"
            done
          }
          echo "node=$(node | jq -R | jq -sc)" >> $GITHUB_OUTPUT
          echo "composite=$(composite | jq -R | jq -sc)" >> $GITHUB_OUTPUT

  release-node:
    needs: [cleanup, detect]
    if: needs.detect.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect.outputs.node) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: extractions/setup-just@v2

      - name: Build
        working-directory: ${{ matrix.action }}
        run: just build

      - name: Test
        working-directory: ${{ matrix.action }}
        run: |
          if compgen -G "src/*.test.ts" > /dev/null; then
            pnpm tsx --test src/*.test.ts
          fi

      - name: Validate action.yml
        run: |
          action="${{ matrix.action }}"
          version=$(yq '.version' "$action/action.yml")
          if [ "$version" = "null" ] || [ -z "$version" ]; then
            echo "::error::$action/action.yml is missing required 'version' field"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

          main=$(yq '.runs.main' "$action/action.yml")
          if [ "$main" != "null" ] && [ -n "$main" ]; then
            if [ ! -f "$action/$main" ]; then
              echo "::error::$action/action.yml runs.main points to '$main' which does not exist"
              exit 1
            fi
          fi

          for field in pre post; do
            file=$(yq ".runs.$field" "$action/action.yml")
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              if [ ! -f "$action/$file" ]; then
                echo "::error::$action/action.yml runs.$field points to '$file' which does not exist"
                exit 1
              fi
            fi
          done
        id: version

      - name: Validate JS files are parseable
        working-directory: ${{ matrix.action }}
        run: |
          for field in main pre post; do
            file=$(yq ".runs.$field" action.yml)
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              echo "Checking runs.$field: $file"
              node --check "$file"
            fi
          done

      - name: Create orphan tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./orphan-release/orphan-release.sh
          --source "${{ matrix.action }}"
          --version "${{ steps.version.outputs.version }}"
          --exclude "src node_modules tsconfig.json justfile package.json pnpm-lock.yaml pnpm-workspace.yaml"
          --include-branch

  release-composite:
    needs: [cleanup, detect]
    if: needs.detect.outputs.composite != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create orphan tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for action in $(echo '${{ needs.detect.outputs.composite }}' | jq -r '.[]'); do
            version=$(yq '.version' "$action/action.yml")
            if [ "$version" = "null" ] || [ -z "$version" ]; then
              echo "::error::$action/action.yml is missing required 'version' field"
              exit 1
            fi
            ./orphan-release/orphan-release.sh --source "$action" --version "$version" --include-branch
          done


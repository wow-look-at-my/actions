name: Release Actions

on:
  push:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup orphaned branch tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./orphan-release/orphan-cleanup.sh

  check-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README is up-to-date
        run: |
          ./generate-readme.sh > README.md.tmp
          if ! diff -q README.md README.md.tmp > /dev/null 2>&1; then
            echo "::error::README.md is out of date. Run ./generate-readme.sh > README.md and commit the result."
            diff README.md README.md.tmp || true
            exit 1
          fi
          rm README.md.tmp

  no-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: no-scripts-action
      - uses: ./no-scripts-action

  test-cache-rg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./cache-rg/test

  # Dogfood round-trip for the cache hand-off trio against the REAL cache
  # service: upload -> nameless discovery -> named download -> ambiguity
  # hard-error -> cleanup. Entries are run-scoped, so parallel CI runs never
  # interfere.
  test-cache-xfer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # cache-cleanup deletes entries; nameless discovery lists them
    steps:
      - uses: actions/checkout@v4
      # Toolchain only -- this job builds three directories itself below.
      - uses: ./.github/actions/setup-and-build
      # The shared sources are a byte-identity convention; a drifted copy
      # would silently fork the wire format between upload and download.
      - name: Shared cache-xfer sources are byte-identical
        run: |
          for f in lib.ts lib.test.ts xfer.ts xfer.test.ts; do
            cmp "cache-upload/src/$f" "cache-download/src/$f"
          done
      # node24 actions: dist/ is not committed, so build before `uses: ./...`.
      - name: Build the cache hand-off trio
        run: |
          for a in cache-upload cache-download cache-cleanup; do
            (cd "$a" && just build)
          done
      - name: Create hand-off payload
        run: |
          mkdir -p handoff-src/sub
          echo "round-trip ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" > handoff-src/hello.txt
          echo nested > handoff-src/sub/nested.txt
      - name: Upload hand-off (dogfood-a)
        uses: ./cache-upload
        with:
          name: dogfood-a
          path: handoff-src
      - name: Nameless download discovers the single hand-off
        id: nameless
        uses: ./cache-download
        with:
          path: restore-nameless
      - name: Assert nameless discovery picked dogfood-a
        run: |
          test "${{ steps.nameless.outputs.name }}" = "dogfood-a"
          diff handoff-src/hello.txt restore-nameless/hello.txt
          diff handoff-src/sub/nested.txt restore-nameless/sub/nested.txt
      - name: Named download still works
        id: named
        uses: ./cache-download
        with:
          name: dogfood-a
          path: restore-named
      - name: Assert named download restored the files
        run: |
          test "${{ steps.named.outputs.cache-hit }}" = "true"
          test "${{ steps.named.outputs.name }}" = "dogfood-a"
          diff handoff-src/hello.txt restore-named/hello.txt
      - name: Upload a second hand-off (dogfood-b)
        uses: ./cache-upload
        with:
          name: dogfood-b
          path: handoff-src/hello.txt
      # The REST cache list can lag the twirp finalize by a moment; wait
      # until both entries are visible so the ambiguity assert is not flaky.
      - name: Wait for both hand-offs to be listable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 15); do
            n=$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/caches?key=cache-xfer-${GITHUB_RUN_ID}-&per_page=100" \
              | jq '[.actions_caches[].key] | length')
            echo "listed ${n:-0} run-scoped entries"
            [ "${n:-0}" -ge 2 ] && exit 0
            sleep 2
          done
          echo "::error::cache list never showed both hand-offs"
          exit 1
      - name: Nameless download must hard-fail on ambiguity
        id: ambiguous
        continue-on-error: true
        uses: ./cache-download
        with:
          path: restore-ambiguous
      - name: Assert the ambiguous nameless download failed without restoring
        run: |
          test "${{ steps.ambiguous.outcome }}" = "failure"
          test ! -e restore-ambiguous/hello.txt
      - name: Cleanup deletes this run's entries
        id: cleanup
        uses: ./cache-cleanup
      - name: Assert cleanup deleted both hand-offs
        run: test "${{ steps.cleanup.outputs.deleted-count }}" -ge 2

  # Dogfood the all-builds name guard: it must pass on this repo (no job is
  # ever named all-builds here) and fail on the shadowed fixture. The token is
  # deliberately narrow so the run also shows the API layers degrading to
  # warnings under a scoped-down token (informational — not asserted).
  test-no-all-builds-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # node24 action: dist/ is not committed, so build before `uses: ./...`.
      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: no-all-builds-job
      - name: Guard passes on this repo
        uses: ./no-all-builds-job
      # The runner refuses to override GITHUB_* vars via step `env:`, so the
      # failure path execs the built bundle with a shell-level assignment
      # pointing GITHUB_WORKSPACE at the fixture — same entry point the action
      # runs. The bogus token exercises the API layers' warn-and-skip path.
      - name: Guard must fail on the shadowed fixture (file-scan layer)
        id: shadowed
        continue-on-error: true
        run: GITHUB_WORKSPACE="${GITHUB_WORKSPACE}/no-all-builds-job/test/fixtures/shadowed" INPUT_TOKEN=x node no-all-builds-job/dist/index.js
      - name: Assert the shadowed fixture failed the guard
        run: test "${{ steps.shadowed.outcome }}" = "failure"

  test-typescript:
    runs-on: ubuntu-latest
    # repro3.ts in the dogfood harness makes a real authenticated octokit call
    # (repos.get) with the default github-token, so the job needs read access.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # typescript is a node24 action: its dist/ is not committed, so build it
      # before the dogfood harness invokes it via `uses: ./typescript`.
      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: typescript
      # Guard against the "fake string" branded-primitive footgun (boxed String
      # output streams) creeping back in. Type-aware ESLint config under
      # typescript/eslint.config.js; known existing cases carry scoped disables.
      - name: Lint typescript action
        working-directory: typescript
        run: just lint
      - uses: ./typescript/test

  validate-slugs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate action slugs
        run: |
          repo="${{ github.repository }}"
          errors=0

          # Correct format:   repo@action-name#ref
          # Wrong format:     repo/action-name@ref
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            num=$(echo "$line" | cut -d: -f2)
            match=$(echo "$line" | cut -d: -f3- | sed 's/^[[:space:]]*//')
            slug=$(echo "$match" | grep -oP "(?<=${repo}/)[^@/]+" || true)
            echo "::error file=${file},line=${num}::Wrong action slug format '${slug}' — use ${repo}@${slug}#ref instead of ${repo}/${slug}@ref"
            errors=$((errors + 1))
          done < <(grep -rn "${repo}/[a-zA-Z0-9_-]*@" --include='*.yml' --include='*.yaml' --include='*.md' . || true)

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi

  validate-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow YAML with action-validator
        uses: ./action-validator
        with:
          # Only the workflow files are validated here. The repo's action.yml
          # files carry a non-standard `version:` field (consumed by this
          # workflow's release jobs for orphan tags) and `using: node24`, both of
          # which action-validator's bundled schema rejects -- so a non-matching
          # glob skips them (nullglob -> zero iterations) while every workflow,
          # including the reusable ones, is schema-checked.
          actions: 'no-such-dir/*/action.yml'
          workflows: '.github/workflows/*.yml'

  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.find.outputs.node }}
      composite: ${{ steps.find.outputs.composite }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Skip */test/* — those are dogfood harnesses invoked from CI, not released actions.
          node() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ -f "$n/package.json" ] && echo "$n"
            done
          }
          composite() {
            find . -name action.yml -not -path './.github/*' -not -path '*/test/*' -printf '%h\n' | sed 's|^\./||' | while read -r n; do
              [ ! -f "$n/package.json" ] && echo "$n"
            done
          }
          echo "node=$(node | jq -R | jq -sc)" >> $GITHUB_OUTPUT
          echo "composite=$(composite | jq -R | jq -sc)" >> $GITHUB_OUTPUT

  release-node:
    needs: [cleanup, detect]
    if: needs.detect.outputs.node != '[]'
    strategy:
      fail-fast: false
      matrix:
        action: ${{ fromJson(needs.detect.outputs.node) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-and-build
        with:
          action-dir: ${{ matrix.action }}

      - name: Test
        working-directory: ${{ matrix.action }}
        run: |
          if compgen -G "src/*.test.ts" > /dev/null; then
            pnpm tsx --test src/*.test.ts
          fi

      - name: Validate action.yml
        run: |
          action="${{ matrix.action }}"
          version=$(yq '.version' "$action/action.yml")
          if [ "$version" = "null" ] || [ -z "$version" ]; then
            echo "::error::$action/action.yml is missing required 'version' field"
            exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

          main=$(yq '.runs.main' "$action/action.yml")
          if [ "$main" != "null" ] && [ -n "$main" ]; then
            if [ ! -f "$action/$main" ]; then
              echo "::error::$action/action.yml runs.main points to '$main' which does not exist"
              exit 1
            fi
          fi

          for field in pre post; do
            file=$(yq ".runs.$field" "$action/action.yml")
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              if [ ! -f "$action/$file" ]; then
                echo "::error::$action/action.yml runs.$field points to '$file' which does not exist"
                exit 1
              fi
            fi
          done
        id: version

      - name: Validate JS files are parseable
        working-directory: ${{ matrix.action }}
        run: |
          for field in main pre post; do
            file=$(yq ".runs.$field" action.yml)
            if [ "$file" != "null" ] && [ -n "$file" ]; then
              echo "Checking runs.$field: $file"
              node --check "$file"
            fi
          done

      - name: Create orphan tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./orphan-release/orphan-release.sh
          --source "${{ matrix.action }}"
          --version "${{ steps.version.outputs.version }}"
          --exclude "src node_modules tsconfig.json justfile package.json pnpm-lock.yaml pnpm-workspace.yaml"
          --include-branch

  release-composite:
    needs: [cleanup, detect]
    if: needs.detect.outputs.composite != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create orphan tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for action in $(echo '${{ needs.detect.outputs.composite }}' | jq -r '.[]'); do
            version=$(yq '.version' "$action/action.yml")
            if [ "$version" = "null" ] || [ -z "$version" ]; then
              echo "::error::$action/action.yml is missing required 'version' field"
              exit 1
            fi
            ./orphan-release/orphan-release.sh --source "$action" --version "$version" --include-branch
          done


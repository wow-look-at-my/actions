name: PR Preview (buildhost)

# Thin reusable workflow: deploy a pull-request preview to a buildhost static-site
# project and post a sticky PR comment with the preview URL. It reuses buildhost's
# own buildhost-publish-site action for the upload (tar.gz PUT to
# sites.<domain>/<project>/branch/<branch>, GitHub OIDC auth -- no static secret).
#
# This is the buildhost flavour. For the GitHub Pages flavour, use
# .github/workflows/pr-preview.yml instead.

on:
  workflow_call:
    inputs:
      source-dir:
        description: 'Directory to deploy. Mutually exclusive with artifact-name.'
        required: false
        default: '.'
        type: string
      artifact-name:
        description: 'Name of a previously-uploaded run artifact to deploy instead of checking out source-dir. Mutually exclusive with source-dir.'
        required: false
        default: ''
        type: string
      buildhost-server:
        description: 'Base URL of the buildhost server.'
        required: false
        default: 'https://pazer.build'
        type: string
      project:
        description: 'Buildhost project name. Defaults to the (lowercase) repository name via buildhost OIDC auto-provisioning. Pin this if the repo name is not already lowercase.'
        required: false
        default: ''
        type: string
      pr-number:
        description: 'PR number for the pr-<number> preview branch. Defaults to the event PR number.'
        required: false
        default: ''
        type: string
      comment:
        description: 'Leave a sticky comment on the PR with the preview URL.'
        required: false
        default: true
        type: boolean
      public:
        description: 'Serve the preview publicly even when the source repo/buildhost project is private (opt-in). Defaults to false so a private repo''s preview stays gated behind buildhost auth.'
        required: false
        default: false
        type: boolean
    outputs:
      preview-url:
        description: 'The deployed preview URL.'
        value: ${{ jobs.preview.outputs.preview_url }}

# id-token: lets buildhost-publish-site authenticate to buildhost via OIDC (no
# static secret). pull-requests: write is for the sticky comment. actions: read
# is needed when artifact-name is used -- buildhost-publish-site downloads the
# named artifact through the Actions REST API (listWorkflowRunArtifacts +
# downloadArtifact), which both require it. Callers must grant at least these.
permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write
  # checks read: the org no-all-builds-job guard (the first step inside
  # buildhost-publish-site) scans the run's jobs and the head commit's
  # check runs since no-all-builds-job#3 (2026-07-20), and FAILS CLOSED
  # when it cannot scan ("Resource not accessible by integration"). A
  # reusable workflow's jobs only get scopes declared HERE and granted by
  # the caller; a caller that does not grant checks: read startup-fails.
  checks: read

jobs:
  preview:
    runs-on: ubuntu-latest
    # Fork PRs get no OIDC token, so a preview cannot authenticate to buildhost.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview_url: ${{ steps.publish.outputs.site_url }}
    steps:
      - name: Validate inputs
        if: inputs.artifact-name != '' && inputs.source-dir != '.'
        run: |
          echo "::error::Cannot specify both 'artifact-name' and 'source-dir'. Use one or the other."
          exit 1
        shell: bash

      - name: Checkout caller repository
        if: inputs.artifact-name == ''
        uses: actions/checkout@v6
        with:
          sparse-checkout: ${{ inputs.source-dir }}
          path: __caller

      # Reuse buildhost's own publish-site action for the upload (tar.gz PUT to
      # sites.<domain>/<project>/branch/<branch>, OIDC auth, project
      # auto-provisioned from the repo identity).
      - name: Publish preview to buildhost
        id: publish
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-site@master
        with:
          server: ${{ inputs.buildhost-server }}
          project: ${{ inputs.project }}
          branch: ${{ inputs.pr-number && format('pr-{0}', inputs.pr-number) || github.event.number && format('pr-{0}', github.event.number) || github.ref_name }}
          source_dir: ${{ inputs.artifact-name == '' && format('__caller/{0}', inputs.source-dir) || '' }}
          artifact_name: ${{ inputs.artifact-name }}
          public: ${{ inputs.public }}

      - name: Comment preview URL
        if: inputs.comment && github.event_name == 'pull_request'
        uses: wow-look-at-my/actions@typescript#latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.publish.outputs.site_url }}
        with:
          script: |
            const url: string = process.env.PREVIEW_URL ?? "";
            const marker = "<!-- pr-preview-buildhost -->";
            const body = `${marker}\n:rocket: **Preview deployed to buildhost**\n\n${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await octokit.paginate(octokit.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c: any) => c.body && c.body.includes(marker));
            if (existing) {
              await octokit.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await octokit.rest.issues.createComment({ owner, repo, issue_number, body });
            }

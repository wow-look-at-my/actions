name: PR Preview

on:
    workflow_call:
        inputs:
            source-dir:
                description: Directory containing files to deploy. Required when artifact-name is not set.
                required: false
                type: string
                default: "."
            artifact-name:
                description: Name of a previously-uploaded artifact to use as the deploy source. When set, the sparse checkout of source-dir is skipped and the artifact is downloaded instead.
                required: false
                type: string
                default: ""
            preview-branch:
                description: Branch on which the previews will be deployed.
                type: string
                default: gh-pages
            umbrella-dir:
                description: Path to the directory containing all previews.
                type: string
                default: pr-preview
            shared-dirs:
                description: Comma-separated directory names kept once at the root of the preview branch instead of duplicated into each PR subdirectory. Merged additively on deploy; unreferenced files are garbage-collected when previews go away.
                type: string
                default: ""
            pages-base-url:
                description: URL of the repo's GitHub Pages site.
                type: string
                default: ""
            pages-base-path:
                description: Path that GitHub Pages is served from.
                type: string
                default: ""
            pr-number:
                description: The PR number to use for the preview path. Defaults to the PR number from the GitHub event context.
                type: string
                default: ""
            comment:
                description: Whether to leave a sticky comment on the calling PR.
                type: boolean
                default: true
            action:
                description: "Determines what this workflow will do when it is executed. Supported values: deploy, remove, auto (default)."
                type: string
                default: auto
            deploy-commit-message:
                description: The commit message to use when adding/updating a preview.
                type: string
                default: ""
            remove-commit-message:
                description: The commit message to use when removing a preview.
                type: string
                default: ""
            commit-status-context:
                description: The context string for commit statuses (e.g., shown as the status check name).
                type: string
                default: "Preview"
            deploy-to-pages:
                description: Whether to upload and deploy the Pages artifact. Set to false for git-only operations.
                type: boolean
                default: true
        outputs:
            deployment-action:
                description: Resolved action (deploy, remove, none).
                value: ${{ jobs.preview.outputs.deployment_action }}
            preview-url:
                description: Full URL to the preview.
                value: ${{ jobs.preview.outputs.preview_url }}

permissions:
    contents: write
    pull-requests: write
    pages: write
    id-token: write
    statuses: write

concurrency:
    group: gh-pages
    cancel-in-progress: false

jobs:
    preview:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        outputs:
            deployment_action: ${{ steps.setup.outputs.deployment_action }}
            preview_url: ${{ steps.setup.outputs.preview_url }}
        environment:
            name: github-pages
            url: ${{ steps.pages-deploy.outputs.page_url || steps.pages-deploy-remove.outputs.page_url }}
        steps:
            - name: Validate inputs
              if: inputs.artifact-name != '' && inputs.source-dir != '.'
              run: |
                  echo "::error::Cannot specify both 'artifact-name' and 'source-dir'. Use one or the other."
                  exit 1
              shell: bash

            - name: Checkout caller repository
              if: inputs.artifact-name == ''
              uses: actions/checkout@v6
              with:
                  sparse-checkout: ${{ inputs.source-dir }}

            - name: Setup preview environment
              id: setup
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: setup
                  action: ${{ inputs.action }}
                  umbrella-dir: ${{ inputs.umbrella-dir }}
                  pages-base-url: ${{ inputs.pages-base-url }}
                  pages-base-path: ${{ inputs.pages-base-path }}
                  pr-number: ${{ inputs.pr-number || github.event.number }}
                  action-ref: ${{ github.job_workflow_sha }}

            - name: Download build artifact
              if: inputs.artifact-name != '' && env.deployment_action == 'deploy'
              uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.artifact-name }}
                  path: __artifact-download

            # DEPLOYMENT

            - name: Set pending commit status
              if: env.deployment_action == 'deploy' && github.event_name == 'pull_request'
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: status
                  token: ${{ github.token }}
                  sha: ${{ github.event.pull_request.head.sha }}
                  context: ${{ inputs.commit-status-context }}
                  state: pending
                  description: Deploying preview...
                  target-url: ${{ env.preview_url }}

            - name: Deploy preview to branch
              if: env.deployment_action == 'deploy'
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: git-update
                  mode: deploy
                  branch: ${{ inputs.preview-branch }}
                  token: ${{ github.token }}
                  source-dir: ${{ inputs.artifact-name != '' && '__artifact-download' || inputs.source-dir }}
                  target-path: ${{ env.preview_file_path }}
                  umbrella-dir: ${{ inputs.umbrella-dir }}
                  shared-dirs: ${{ inputs.shared-dirs }}
                  commit-message: ${{ inputs.deploy-commit-message || (github.event_name == 'pull_request' && format('Deploy preview for PR {0} 🛫', github.event.number)) || format('Deploy from {0}', github.sha) }}

            - name: Upload Pages artifact
              if: env.deployment_action == 'deploy' && inputs.deploy-to-pages
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ${{ runner.temp }}/__gh-pages-content

            - name: Deploy to GitHub Pages
              id: pages-deploy
              if: env.deployment_action == 'deploy' && inputs.deploy-to-pages
              uses: actions/deploy-pages@v5

            - name: Set success commit status
              if: |
                  env.deployment_action == 'deploy' &&
                  github.event_name == 'pull_request' &&
                  (steps.pages-deploy.outcome == 'success' || steps.pages-deploy.outcome == 'skipped')
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: status
                  token: ${{ github.token }}
                  sha: ${{ github.event.pull_request.head.sha }}
                  context: ${{ inputs.commit-status-context }}
                  state: success
                  description: Preview is live!
                  target-url: ${{ env.preview_url }}

            - name: Post deploy comment
              if: |
                  env.deployment_action == 'deploy' &&
                  inputs.comment &&
                  github.event_name == 'pull_request' &&
                  (steps.pages-deploy.outcome == 'success' || steps.pages-deploy.outcome == 'skipped')
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: comment
                  token: ${{ github.token }}
                  pr-number: ${{ inputs.pr-number || github.event.number }}
                  preview-branch: ${{ inputs.preview-branch }}
                  comment: "true"

            - name: Set failure commit status
              if: |
                  failure() &&
                  env.deployment_action == 'deploy' &&
                  github.event_name == 'pull_request'
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: status
                  token: ${{ github.token }}
                  sha: ${{ github.event.pull_request.head.sha }}
                  context: ${{ inputs.commit-status-context }}
                  state: failure
                  description: Preview deployment failed
                  target-url: ${{ env.preview_url }}

            # REMOVAL

            - name: Remove preview from branch
              if: env.deployment_action == 'remove'
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: git-update
                  mode: remove
                  branch: ${{ inputs.preview-branch }}
                  token: ${{ github.token }}
                  target-path: ${{ env.preview_file_path }}
                  umbrella-dir: ${{ inputs.umbrella-dir }}
                  shared-dirs: ${{ inputs.shared-dirs }}
                  commit-message: ${{ inputs.remove-commit-message || (github.event_name == 'pull_request' && format('Remove preview for PR {0} 🛬', github.event.number)) || format('Remove deployment from {0}', github.sha) }}

            - name: Upload Pages artifact for removal
              if: env.deployment_action == 'remove' && inputs.deploy-to-pages
              uses: actions/upload-pages-artifact@v4
              with:
                  path: ${{ runner.temp }}/__gh-pages-content

            - name: Deploy removal to GitHub Pages
              id: pages-deploy-remove
              if: env.deployment_action == 'remove' && inputs.deploy-to-pages
              uses: actions/deploy-pages@v5

            - name: Post remove comment
              if: |
                  env.deployment_action == 'remove' &&
                  inputs.comment &&
                  github.event_name == 'pull_request'
              uses: wow-look-at-my/actions@pr-preview#latest
              with:
                  command: comment
                  token: ${{ github.token }}
                  pr-number: ${{ inputs.pr-number || github.event.number }}
                  preview-branch: ${{ inputs.preview-branch }}
                  comment: "true"

name: ste-lint
version: 1
description: Check prose against the mechanical subset of ASD-STE100 Simplified Technical English — sentence length, contractions, banned modal verbs, and semicolons

inputs:
  files:
    description: 'Glob patterns to check, separated by whitespace or commas. Matching nothing is a failure, never a quiet pass.'
    required: false
    default: '**/*.md'
  hard-max-words:
    description: 'A sentence longer than this fails. STE caps a description at 25 words.'
    required: false
    default: '25'
  warn-max-words:
    description: 'A sentence longer than this warns. STE caps an instruction at 20 words.'
    required: false
    default: '20'

outputs:
  files:
    description: 'How many files were checked'
  violations:
    description: 'How many findings failed the run'

runs:
  using: node24
  main: dist/index.js

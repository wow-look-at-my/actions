name: ste-lint
description: Run slopfix's hard-wrap and STE rules on the repository's markdown, and fail on any finding

inputs:
  paths:
    description: 'Paths to read, space separated. A directory is walked, so the step must run after the checkout.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: wow-look-at-my/slopfix@master
      with:
        only: ste,wrap
        paths: ${{ inputs.paths }}

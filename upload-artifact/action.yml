name: Upload Artifact (cache-backed)
version: 1
description: Upload a build artifact via the Actions cache service — a drop-in replacement for actions/upload-artifact that is immune to the artifact storage quota

inputs:
  name:
    description: 'Artifact name'
    required: false
    default: 'artifact'
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload'
    required: true
  if-no-files-found:
    description: >-
      The desired behavior if no files are found using the provided path.
      Available Options:
      warn: Output a warning but do not fail the action.
      error: Fail the action with an error message.
      ignore: Do not output any warnings or errors, the action does not fail.
    required: false
    default: 'warn'
  retention-days:
    description: >-
      Accepted for call-site compatibility and IGNORED: the cache service
      self-manages retention (entries unused for ~7 days are evicted, and the
      repo's ~10 GB cap evicts least-recently-used entries first).
    required: false
  compression-level:
    description: >-
      Accepted for call-site compatibility and IGNORED: the cache layer already
      zstd-compresses payloads on upload.
    required: false
  overwrite:
    description: >-
      If true, a cache entry matching this artifact's key is deleted before the
      new one is saved (cache entries are immutable, so overwrite means
      delete-then-recreate). If false, the action fails if the artifact was
      already uploaded by this run attempt. Does not fail if the artifact does
      not exist.
    required: false
    default: 'false'
  include-hidden-files:
    description: >-
      If true, hidden files will be included in the artifact. If false, hidden
      files will be excluded from the artifact.
    required: false
    default: 'false'
  token:
    description: >-
      GitHub token used for cache-management REST calls: deleting the old entry
      on overwrite (needs actions: write) and cache-usage diagnostics (needs
      actions: read). The upload itself uses the runner-injected cache-service
      credentials and needs no token.
    required: false
    default: ${{ github.token }}

outputs:
  artifact-id:
    description: >-
      The numeric cache entry id reported by the cache backend when greater
      than zero, else empty. Cache-backed artifacts are not REST "artifacts";
      this id is only meaningful to the cache-management APIs.
  artifact-url:
    description: >-
      Always empty — cache-backed artifacts have no browser download URL.
      Publish human-download deliverables to buildhost instead.
  artifact-digest:
    description: 'SHA-256 hex digest of the payload tar that was uploaded.'
  artifact-key:
    description: 'The exact cache key the artifact was saved under (for debugging).'

runs:
  using: node24
  main: dist/index.js

name: Push Excludes Tags
description: Fail CI when a workflow's push trigger names no ref filter, so tag pushes start it again

runs:
  using: composite
  steps:
    - name: Check every workflow's push trigger for a ref filter
      uses: wow-look-at-my/actions@typescript#latest
      with:
        script: |
          const FILTERS = ['branches', 'branches-ignore', 'tags', 'tags-ignore'];
          const dir = path.join(env.GITHUB_WORKSPACE!, '.github', 'workflows');
          if (!fs.existsSync(dir)) {
            core.warning(`no ${dir}, so this run enforced nothing. Check the repo out first.`);
            return;
          }
          const names = fs.readdirSync(dir).filter(name => /\.ya?ml$/.test(name)).sort();
          if (names.length === 0) {
            core.warning(`no workflow file under ${dir}, so this run enforced nothing.`);
            return;
          }
          // A self-hosted runner does not ship yq; fetch the pinned release binary once into RUNNER_TEMP when it is absent.
          // The tag is pinned, not 'latest': a yq 5 that renames -o=json would break every consumer of this action at once.
          const yq = await (async () => {
            if ((await $`bash -c ${'command -v yq'}`.nothrow()).exitCode === 0) return 'yq';
            const os = ({Linux: 'linux', macOS: 'darwin', Windows: 'windows'} as Record<string, string>)[env.RUNNER_OS ?? 'Linux'] ?? 'linux';
            const arch = ({X64: 'amd64', ARM64: 'arm64'} as Record<string, string>)[env.RUNNER_ARCH ?? 'X64'] ?? 'amd64';
            const ext = os === 'windows' ? '.exe' : '';
            const dest = path.join(env.RUNNER_TEMP!, `yq${ext}`);
            if (fs.existsSync(dest)) return dest;
            const url = `https://github.com/mikefarah/yq/releases/download/v4.53.6/yq_${os}_${arch}${ext}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`could not download yq from ${url}: HTTP ${res.status}`);
            fs.writeFileSync(dest, Buffer.from(await res.arrayBuffer()));
            fs.chmodSync(dest, 0o755);
            return dest;
          })();
          let found = 0;
          for (const name of names) {
            const file = `.github/workflows/${name}`;
            // The $ runner never shell-splits, so a quoted literal reaches yq with its quotes; the expression is an interpolated argument.
            const on = await $`${yq} -o=json ${'.["on"]'} ${path.join(dir, name)}`.json();
            const unfiltered =
              on === 'push' ||
              (Array.isArray(on) && on.includes('push')) ||
              (on !== null && typeof on === 'object' && 'push' in on &&
                (on.push === null || typeof on.push !== 'object' || !FILTERS.some(key => key in on.push)));
            if (!unfiltered) continue;
            found++;
            core.error(`${file}: its push trigger names no ref filter, so every tag push starts this workflow again. Add \`branches: ['**']\` under \`push:\` (or \`tags-ignore: ['**']\`) to keep it on branch pushes.`, {file});
          }
          if (found > 0) core.setFailed(`${found} of ${names.length} workflow(s) still match tag pushes`);
          else core.info(`OK - every push trigger names a ref filter in ${names.length} file(s)`);

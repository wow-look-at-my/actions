name: Push Excludes Tags
description: Fail CI when a workflow's push trigger names no ref filter, so tag pushes start it again

inputs:
  exclude:
    description: >-
      Glob patterns for workflow files the scan skips, newline or comma
      separated. Intended for fixtures that violate the rule on purpose.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_EXCLUDE: ${{ inputs.exclude }}
      run: ${{ github.action_path }}/scan-workflows.sh

name: Propagate Inputs
version: 1
description: Export parent composite action INPUT_* env vars to GITHUB_ENV so child uses steps can read them.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        env -0 | while IFS= read -r -d '' entry; do
          key="${entry%%=*}"; val="${entry#*=}"
          [[ $key == INPUT_* ]] && printf '%s<<__DELIM__\n%s\n__DELIM__\n' "$key" "$val" >> "$GITHUB_ENV"
        done

name: PR Preview Scripts
description: Backend steps for the pr-preview reusable workflow (setup, git-update, comment, status)

inputs:
    command:
        description: "Which step to run: setup, git-update, comment, or status"
        required: true

    # setup
    action:
        description: "What the workflow should do. Supported values: deploy, remove, auto"
        required: false
        default: auto
    umbrella-dir:
        description: Path to the directory containing all previews
        required: false
        default: pr-preview
    pages-base-url:
        description: URL of the repo's GitHub Pages site
        required: false
        default: ""
    pages-base-path:
        description: Path that GitHub Pages is served from
        required: false
        default: ""
    pr-number:
        description: PR number to use for the preview path
        required: false
        default: ""
    action-ref:
        description: Ref of this action, reported in the sticky comment
        required: false
        default: ""

    # git-update
    mode:
        description: "For command=git-update: deploy or remove"
        required: false
        default: ""
    branch:
        description: Branch the previews are deployed to
        required: false
        default: gh-pages
    source-dir:
        description: Directory containing files to deploy
        required: false
        default: ""
    target-path:
        description: Path within the preview branch to write to
        required: false
        default: ""
    commit-message:
        description: Commit message for the preview branch update
        required: false
        default: ""

    # comment
    preview-branch:
        description: Branch name shown in the sticky comment
        required: false
        default: gh-pages
    comment:
        description: Whether to leave a sticky comment on the calling PR
        required: false
        default: "true"

    # status
    sha:
        description: Commit SHA to attach the status to
        required: false
        default: ""
    context:
        description: Context string for the commit status
        required: false
        default: Preview
    state:
        description: "Commit status state: pending, success, failure"
        required: false
        default: ""
    description:
        description: Commit status description
        required: false
        default: ""
    target-url:
        description: URL the commit status links to
        required: false
        default: ""

    token:
        description: GitHub token used for API calls and pushing to the preview branch
        required: false
        default: ${{ github.token }}

runs:
    using: node24
    main: dist/index.js

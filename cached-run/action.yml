name: Cached Run
version: 1
description: Run a script with its output paths restored from cache first and saved after, keyed by the script text and the path list

inputs:
  run:
    description: 'The script to run. `set -euo pipefail` is prepended and a sentinel `touch` is appended; the cache is saved only when that sentinel appears.'
    required: true
  paths:
    description: 'The output paths to restore before the run and save after it, one per line. Sorted and deduplicated before use, so reordering them does not change the key.'
    required: true
  key:
    description: 'Readable text carried in the cache key, and mixed into the digest. To name files the script reads, prefer a hashFiles comment on its own line inside `run`. The runner expands the expression before this action sees it, so the hash lands in the script text the digest already covers. See the README.'
    required: false
    default: ''
  restore-keys:
    description: 'Fallback key prefixes for a partial restore, one per line, passed through to actions/cache/restore.'
    required: false
    default: ''
  working-directory:
    description: 'The directory to run the script in.'
    required: false
    default: '.'
  skip-on-hit:
    description: 'Skip the run on an exact key hit, because the cached paths already hold what the run produces. Set it false for a warm cache, where the paths feed the run rather than being its product.'
    required: false
    default: 'true'
  save-on:
    description: 'Which refs may WRITE an entry: `default-branch` (the default) or `any`. Restoring is untouched either way, because a branch already reads the default branch''s entries. A branch that writes gets its own scope, which only that branch reads, and the entry still costs the repository''s shared budget.'
    required: false
    default: 'default-branch'

outputs:
  cache-key:
    description: 'The computed primary cache key'
    value: ${{ steps.plan.outputs.key }}
  cache-hit:
    description: 'Whether the primary key hit exactly, as `true` or `false`'
    value: ${{ steps.decide.outputs.hit }}
  cache-matched-key:
    description: 'The key that actually restored, primary or a restore-keys fallback; empty on a miss'
    value: ${{ steps.restore.outputs.cache-matched-key }}
  skipped:
    description: 'Whether the run was skipped because of an exact hit'
    value: ${{ steps.decide.outputs.skip }}
  cache-saved:
    description: 'Whether this run saved a new cache entry'
    value: ${{ steps.verify.outputs.save == 'true' }}
  save-allowed:
    description: 'Whether this ref may write an entry at all, as `true` or `false`'
    value: ${{ steps.plan.outputs.save-allowed }}

runs:
  using: composite
  steps:
    # Split from the run step so the key exists before the restore, and so the restore's hit can gate the run.
    - name: Plan the cache key
      id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN_SCRIPT: ${{ inputs.run }}
        RAW_PATHS: ${{ inputs.paths }}
        EXTRA_KEY: ${{ inputs.key }}
        RESTORE_KEYS: ${{ inputs.restore-keys }}
        RUNNER_OS_NAME: ${{ runner.os }}
        RUNNER_ARCH_NAME: ${{ runner.arch }}
        SAVE_ON: ${{ inputs.save-on }}
        # The repository's own default branch, so a repo whose default is `main` gates on `main`.
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js"

    - name: Restore the cached output paths
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.plan.outputs.cache-paths }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restore-keys }}

    # A restore-keys fallback is a partial result, so only an exact hit can skip the run.
    - name: Decide whether the run is still needed
      id: decide
      shell: bash
      run: |
        set -euo pipefail
        # actions/cache reports a miss as an empty string, so normalize it before a caller compares it.
        if [ "${{ steps.restore.outputs.cache-hit }}" = "true" ]; then
          echo "hit=true" >> "$GITHUB_OUTPUT"
        else
          echo "hit=false" >> "$GITHUB_OUTPUT"
        fi
        if [ "${{ steps.restore.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.skip-on-hit }}" = "true" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo 'Exact cache hit and skip-on-hit is set, so the script does not run.'
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    # A skipped run exports nothing, and a caller that read its exports from a step of its own would have to know which ones the script sets. The cache carries them instead.
    - name: Replay what the cached run exported
      if: steps.decide.outputs.skip == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -d "${{ steps.plan.outputs.envdir }}" ]; then
          echo "::error::cached-run: this entry carries no record of what the run exported. Every entry of this key scheme stores one, so the entry is damaged. A caller that reads an exported variable would see it missing instead."
          exit 1
        fi
        cat "${{ steps.plan.outputs.envdir }}/env" >> "$GITHUB_ENV"
        cat "${{ steps.plan.outputs.envdir }}/path" >> "$GITHUB_PATH"

    - name: Run the script
      id: run
      if: steps.decide.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SENTINEL: ${{ steps.plan.outputs.sentinel }}
        ENV_DIR: ${{ steps.plan.outputs.envdir }}
        SHIM_DIR: ${{ steps.plan.outputs.shim-dir }}
        CARGO_LOG: ${{ steps.plan.outputs.cargo-log }}
      run: |
        set -euo pipefail
        rm -f "$SENTINEL"
        # Cargo mode records each cargo call for the post step. The shim execs the real cargo, so the output is unchanged.
        if [ -n "$SHIM_DIR" ]; then
          export CACHED_RUN_REAL_CARGO="$(command -v cargo)" CACHED_RUN_CARGO_LOG="$CARGO_LOG"
          export PATH="$SHIM_DIR:$PATH"
        fi
        # Where GITHUB_ENV and GITHUB_PATH stand before the script writes to them, so what it appends can be told apart from what the job already had.
        env_mark=$(wc -c < "$GITHUB_ENV")
        path_mark=$(wc -c < "$GITHUB_PATH")
        ${{ inputs.run }}
        touch "$SENTINEL"
        mkdir -p "$ENV_DIR"
        tail -c "+$((env_mark + 1))" "$GITHUB_ENV" > "$ENV_DIR/env"
        tail -c "+$((path_mark + 1))" "$GITHUB_PATH" > "$ENV_DIR/path"

    # Each recorded build replays as a no-op query, which names every unit it used.
    - name: Sort the cargo artifacts for the save
      id: cargo-post
      if: steps.decide.outputs.skip != 'true' && steps.plan.outputs.cargo == 'true'
      shell: bash
      env:
        CARGO_LOG: ${{ steps.plan.outputs.cargo-log }}
        PLAN_PATHS: ${{ steps.plan.outputs.paths }}
        STASH: ${{ steps.plan.outputs.stash }}
        STARTED_MS: ${{ steps.plan.outputs.started-ms }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: REAL_CARGO="$(command -v cargo)" node "$GITHUB_ACTION_PATH/dist/index.js" post

    # The sentinel catches what an exit code cannot: a script that hit its own `exit 0` or `exec` and never reached its last line.
    - name: Check the run reached its final line
      id: verify
      if: steps.decide.outputs.skip != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f "${{ steps.plan.outputs.sentinel }}" ]; then
          echo '::warning::cached-run: the script exited 0 without reaching its last line, so nothing is cached. An early exit 0 or an exec does this.'
          echo "save=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rm -f "${{ steps.plan.outputs.sentinel }}"
        if [ "${{ steps.restore.outputs.cache-hit }}" = "true" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
          echo 'The primary key is already in the cache, so there is nothing new to save.'
        elif [ "${{ steps.plan.outputs.save-allowed }}" != "true" ]; then
          echo "save=false" >> "$GITHUB_OUTPUT"
          echo 'This ref does not write cache entries, so the run produced its paths and saved nothing. The plan step said which policy decided that.'
        else
          echo "save=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save the output paths
      id: save
      if: steps.verify.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.plan.outputs.cache-paths }}
        key: ${{ steps.plan.outputs.key }}

    # always(), so a failed save still hands the workspace artifacts back to the steps after this action.
    - name: Put the workspace artifacts back
      if: always() && steps.cargo-post.outcome != 'skipped'
      shell: bash
      env:
        PLAN_PATHS: ${{ steps.plan.outputs.paths }}
        STASH: ${{ steps.plan.outputs.stash }}
      run: node "$GITHUB_ACTION_PATH/dist/index.js" restore

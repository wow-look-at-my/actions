name: Test cached-run
version: 1
description: Dogfood cached-run against the real Actions cache (never released)

runs:
  using: composite
  steps:
    # A namespace unique to the run, so a rerun starts cold instead of reading its own earlier entry. cached-run/dats covers the key logic itself.
    - name: Pick a cache namespace unique to this run
      id: ns
      shell: bash
      run: echo "ns=cached-run-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT:-1}" >> "$GITHUB_OUTPUT"

    # Both calls run the SAME script text, because a difference there is meant to change the key. The `ran` stamp sits outside `paths`, so only the script itself can put it back. `save-on: any` runs throughout: this suite runs on a feature branch, where the default policy writes nothing and every warm case below would have nothing to hit.
    - name: Cold run, which must execute and save
      id: cold
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-basic
        save-on: any
        paths: .cached-run-test/out
        run: |
          mkdir -p .cached-run-test/out
          echo built > .cached-run-test/out/marker.txt
          touch .cached-run-test/ran

    - name: Drop everything, so only a restore can bring the outputs back
      shell: bash
      run: rm -rf .cached-run-test

    # No skip-on-hit here, so this covers the default.
    - name: Warm run of that same script
      id: warm
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-basic
        save-on: any
        paths: .cached-run-test/out
        run: |
          mkdir -p .cached-run-test/out
          echo built > .cached-run-test/out/marker.txt
          touch .cached-run-test/ran

    - name: Record what is on disk after the warm run
      id: disk
      shell: bash
      run: |
        set -euo pipefail
        restored=no
        ran=no
        if [ -f .cached-run-test/out/marker.txt ]; then
          restored=yes
        fi
        if [ -f .cached-run-test/ran ]; then
          ran=yes
        fi
        echo "restored=${restored}" >> "$GITHUB_OUTPUT"
        echo "ran=${ran}" >> "$GITHUB_OUTPUT"

    - name: The entry round-tripped, and the hit skipped the script
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        if [ "${{ steps.cold.outputs.cache-hit }}" != "false" ]; then
          echo "::error::a fresh namespace reported cache-hit=${{ steps.cold.outputs.cache-hit }}, and a miss must read false"
          fail=1
        fi
        if [ "${{ steps.cold.outputs.cache-saved }}" != "true" ]; then
          echo "::error::the cold run did not save a cache entry"
          fail=1
        fi
        if [ "${{ steps.warm.outputs.cache-key }}" != "${{ steps.cold.outputs.cache-key }}" ]; then
          echo "::error::one script and one path list produced two keys: ${{ steps.cold.outputs.cache-key }} then ${{ steps.warm.outputs.cache-key }}"
          fail=1
        fi
        if [ "${{ steps.warm.outputs.cache-hit }}" != "true" ]; then
          echo "::error::the second call missed a key the first call saved"
          fail=1
        fi
        if [ "${{ steps.warm.outputs.skipped }}" != "true" ]; then
          echo "::error::skip-on-hit was set on an exact hit and the script ran anyway"
          fail=1
        fi
        if [ "${{ steps.warm.outputs.cache-saved }}" = "true" ]; then
          echo "::error::the warm run re-saved a key that was already present"
          fail=1
        fi
        if [ "${{ steps.disk.outputs.restored }}" != "yes" ]; then
          echo "::error::the hit restored no files, so the cached path never came back"
          fail=1
        fi
        if [ "${{ steps.disk.outputs.ran }}" != "no" ]; then
          echo "::error::the uncached stamp is on disk, so the skipped script ran after all"
          fail=1
        fi
        exit "$fail"

    # The warm-cache opt-out: the same exact hit, and the script must run anyway.
    - name: The same script again with skip-on-hit off
      id: noskip
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-basic
        skip-on-hit: 'false'
        save-on: any
        paths: .cached-run-test/out
        run: |
          mkdir -p .cached-run-test/out
          echo built > .cached-run-test/out/marker.txt
          touch .cached-run-test/ran

    - name: skip-on-hit off ran the script on a hit, and saved nothing new
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        if [ "${{ steps.noskip.outputs.cache-hit }}" != "true" ]; then
          echo "::error::the third call reported cache-hit=${{ steps.noskip.outputs.cache-hit }} on a key already in the cache"
          fail=1
        fi
        if [ "${{ steps.noskip.outputs.skipped }}" != "false" ]; then
          echo "::error::skip-on-hit was off and the run was skipped anyway"
          fail=1
        fi
        if [ ! -f .cached-run-test/ran ]; then
          echo "::error::skip-on-hit was off and the script still did not run"
          fail=1
        fi
        if [ "${{ steps.noskip.outputs.cache-saved }}" = "true" ]; then
          echo "::error::a key already in the cache was saved a second time"
          fail=1
        fi
        exit "$fail"

    - name: Drop everything again, so only the fallback can bring the outputs back
      shell: bash
      run: rm -rf .cached-run-test

    # Another script is another key. The prefix names the basic entry, which only restores if the cached path list matches.
    - name: A changed script falls back to the older entry through restore-keys
      id: fallback
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-basic
        restore-keys: cached-run-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.ns.outputs.ns }}-basic-
        save-on: any
        paths: .cached-run-test/out
        run: |
          test -f .cached-run-test/out/marker.txt
          touch .cached-run-test/ran

    - name: The fallback restored the older entry and ran the script
      shell: bash
      run: |
        set -euo pipefail
        fail=0
        if [ "${{ steps.fallback.outputs.cache-key }}" = "${{ steps.cold.outputs.cache-key }}" ]; then
          echo "::error::a changed script kept the key ${{ steps.fallback.outputs.cache-key }}"
          fail=1
        fi
        if [ "${{ steps.fallback.outputs.cache-hit }}" != "false" ]; then
          echo "::error::a fallback reported cache-hit=${{ steps.fallback.outputs.cache-hit }}, and only an exact hit reads true"
          fail=1
        fi
        if [ "${{ steps.fallback.outputs.cache-matched-key }}" != "${{ steps.cold.outputs.cache-key }}" ]; then
          echo "::error::restore-keys matched '${{ steps.fallback.outputs.cache-matched-key }}', not the older entry ${{ steps.cold.outputs.cache-key }}"
          fail=1
        fi
        if [ ! -f .cached-run-test/ran ]; then
          echo "::error::a fallback is a partial result, and the script did not run"
          fail=1
        fi
        exit "$fail"

    - name: A script that exits early saves nothing
      id: early
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-early
        save-on: any
        paths: .cached-run-test/early
        run: |
          mkdir -p .cached-run-test/early
          echo partial > .cached-run-test/early/marker.txt
          exit 0
          echo unreachable > .cached-run-test/early/never.txt

    - name: The early exit tripped the sentinel gate
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ steps.early.outputs.cache-saved }}" = "true" ]; then
          echo "::error::a script that never reached its last line still saved a cache entry"
          exit 1
        fi

    # The ref gate, which is the default. This suite runs on every branch, the default one too, so the expected save follows the ref.
    - name: A cold run under the default save-on saves only from the default branch
      id: gated
      uses: ./cached-run
      with:
        key: ${{ steps.ns.outputs.ns }}-gated
        paths: .cached-run-test/gated
        run: |
          mkdir -p .cached-run-test/gated
          echo built > .cached-run-test/gated/marker.txt

    - name: The run happened, and the entry exists only on the default branch
      shell: bash
      env:
        ON_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      run: |
        set -euo pipefail
        fail=0
        if [ "${{ steps.gated.outputs.save-allowed }}" != "$ON_DEFAULT" ]; then
          echo "::error::save-allowed reads ${{ steps.gated.outputs.save-allowed }}, and this ref being the default branch reads ${ON_DEFAULT}"
          fail=1
        fi
        if [ "$ON_DEFAULT" = "true" ] && [ "${{ steps.gated.outputs.cache-saved }}" != "true" ]; then
          echo "::error::the default branch may write, and the cold run reported cache-saved=${{ steps.gated.outputs.cache-saved }}"
          fail=1
        fi
        if [ "${{ steps.gated.outputs.cache-hit }}" != "false" ]; then
          echo "::error::a fresh namespace reported cache-hit=${{ steps.gated.outputs.cache-hit }}, and a miss must read false"
          fail=1
        fi
        if [ "${{ steps.gated.outputs.skipped }}" != "false" ]; then
          echo "::error::a miss was skipped, so the gated run never produced its paths"
          fail=1
        fi
        if [ ! -f .cached-run-test/gated/marker.txt ]; then
          echo "::error::the gate stopped the script as well as the save"
          fail=1
        fi
        if [ "$ON_DEFAULT" != "true" ] && [ "${{ steps.gated.outputs.cache-saved }}" = "true" ]; then
          echo "::error::a ref that may not write reported cache-saved=true"
          fail=1
        fi
        exit "$fail"

    - name: Clean up
      if: always()
      shell: bash
      run: rm -rf .cached-run-test

name: Common Checks
description: Run this org's GitHub Actions checks once per workflow run, over the calling repo only

runs:
  using: composite
  steps:
    # Ahead of the claim on purpose: a scanner costs the job it runs in, so every caller needs this rather than one of them.
    - uses: wow-look-at-my/actions@disable-windows-defender#latest

    # One job of the run holds the claim. see README.md
    - id: claim
      uses: wow-look-at-my/actions@run-once#latest
      with:
        name: common-checks

    # The slopfix walk skips each submodule, because its prose and workflows belong to another repository.
    - if: steps.claim.outputs.first == 'true'
      uses: wow-look-at-my/slopfix@master
      with:
        only: yaml/all-builds-job,yaml/comment-block,yaml/test-in-workflow,yaml/push-tags,ste,wrap

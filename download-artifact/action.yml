name: Download Artifact (cache-backed)
version: 1
description: Download a cache-backed artifact that was uploaded by this repo's cache-backed upload-artifact action

inputs:
  name:
    description: >-
      Name of the artifact to download. Required in practice: the cache-backed
      implementation has no download-all mode (the cache service only resolves
      exact keys), so an empty name fails the step with an explanation.
    required: false
  path:
    description: 'Destination path. Supports basic tilde expansion. Defaults to $GITHUB_WORKSPACE'
    required: false
  github-token:
    description: >-
      GitHub token used only for restore-miss diagnostics (cache listing and
      usage REST reads; needs actions: read). The restore itself uses the
      runner-injected cache-service credentials.
    required: false
    default: ${{ github.token }}
  run-id:
    description: >-
      The id of the workflow run whose upload should be downloaded. Defaults to
      the current run. An explicit other run-id works only when that run saved
      on a ref this run can restore from (the same branch, a PR's base branch,
      or the default branch -- cache entries are branch-scoped).
    required: false
    default: ${{ github.run_id }}
  repository:
    description: >-
      Accepted for call-site compatibility. Cache-backed artifacts are
      repo-scoped: any value other than the current repository fails the step.
    required: false
    default: ${{ github.repository }}
  pattern:
    description: >-
      NOT SUPPORTED by the cache-backed implementation -- setting it fails the
      step. Download one artifact per step by its explicit name.
    required: false
  merge-multiple:
    description: >-
      NOT SUPPORTED by the cache-backed implementation -- setting it to true
      fails the step. Download one artifact per step by its explicit name.
    required: false
    default: 'false'
  artifact-ids:
    description: >-
      NOT SUPPORTED by the cache-backed implementation -- setting it fails the
      step. Download one artifact per step by its explicit name.
    required: false

outputs:
  download-path:
    description: 'Absolute path of the artifact download'

runs:
  using: node24
  main: dist/index.js

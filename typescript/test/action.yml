name: Test typescript
version: 1
description: "Dogfood the typescript action via file: inputs exercising import/export/return/await/fetch hoisting (never released)"

runs:
  using: composite
  steps:
    - name: "repro.ts: import + globals + await + fetch"
      uses: ./typescript  # setFailed() stops this step. It reacts to a tsc error or a run-time error
      with:
        file: typescript/test/repro.ts  # this step tests import, injected globals, await, and fetch together

    # repro2.ts reads the file package.json from the workspace root
    - name: Seed package.json for repro2 (readFile("package.json"))
      shell: bash
      run: echo '{"version":"9.9.9-test"}' > "${GITHUB_WORKSPACE}/package.json"  # this seeded version must differ from repro2.ts's own VERSION constant

    - name: "repro2.ts: export + import + top-level return"
      id: repro2
      uses: ./typescript
      with:
        file: typescript/test/repro2.ts

    - name: Assert the top-level return reached the result output
      shell: bash
      env:
        RESULT: ${{ steps.repro2.outputs.result }}
      run: |
        set -euo pipefail
        echo "repro2 result output: ${RESULT}"
        if [ "${RESULT}" != '"9.9.9-test"' ]; then
          echo "::error::expected result '\"9.9.9-test\"' (the returned pkg.version), got '${RESULT}'"
          exit 1
        fi
        echo "repro2 OK: top-level return value reached the result output"

    - name: "repro3.ts: injected octokit authenticated with the default token"
      uses: ./typescript  # this step sets no github-token. This step sets no secrets. This step does not call getOctokit()
      with:
        file: typescript/test/repro3.ts  # this step calls octokit.rest.repos.get. The call fails if the token is not valid

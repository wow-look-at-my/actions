name: TypeScript
version: 1
description: Run an inline TypeScript script, validated with tsc, with helpful globals pre-injected.

inputs:
  script:
    description: TypeScript source to execute. The body runs inside an async function with helpers like `core`, `context`, `octokit`, `fs`, `path` already in scope. Mutually exclusive with `file`.
    required: false
    default: ''
  file:
    description: Path to a .ts file to execute (resolved relative to $GITHUB_WORKSPACE). The file contents are treated like an inline `script`. Mutually exclusive with `script`.
    required: false
    default: ''

  # Contexts the runner only exposes via workflow-expression substitution —
  # never to action processes. Pass them through explicitly when needed:
  #   vars: ${{ toJSON(vars) }}
  vars:
    description: 'vars workflow context as JSON. Callers must pass toJSON(vars) wrapped in an expression.'
    required: false
    default: '{}'
  secrets:
    description: 'secrets workflow context as JSON. Callers must pass toJSON(secrets) wrapped in an expression.'
    required: false
    default: '{}'
  steps:
    description: 'steps workflow context as JSON. Callers must pass toJSON(steps) wrapped in an expression.'
    required: false
    default: '{}'
  needs:
    description: 'needs workflow context as JSON. Callers must pass toJSON(needs) wrapped in an expression.'
    required: false
    default: '{}'
  strategy:
    description: 'strategy workflow context as JSON.'
    required: false
    default: '{}'
  matrix:
    description: 'matrix workflow context as JSON. Callers must pass toJSON(matrix) wrapped in an expression.'
    required: false
    default: '{}'

outputs:
  result:
    description: JSON-encoded value returned by the script (if any).
    value: ${{ steps.run.outputs.result }}

runs:
  using: composite
  steps:
    - uses: ./node
      id: run
      with:
        script: ${{ inputs.script }}
        file: ${{ inputs.file }}
        vars: ${{ inputs.vars }}
        secrets: ${{ inputs.secrets }}
        steps: ${{ inputs.steps }}
        needs: ${{ inputs.needs }}
        strategy: ${{ inputs.strategy }}
        matrix: ${{ inputs.matrix }}

name: TypeScript (node)
description: Inner node action for the TypeScript composite wrapper.

inputs:
  script:
    required: false
    default: ''
  file:
    required: false
    default: ''
  vars:
    required: false
    default: '{}'
  secrets:
    required: false
    default: '{}'
  steps:
    required: false
    default: '{}'
  needs:
    required: false
    default: '{}'
  strategy:
    required: false
    default: '{}'
  matrix:
    required: false
    default: '{}'

outputs:
  result:
    description: JSON-encoded value returned by the script (if any).

runs:
  using: node24
  main: ../dist/index.js
